# Run wrangler from this directory. Secrets are set with `wrangler secret put`
# and are never written here: EMAIL_HASH_KEY, AWS_ACCESS_KEY_ID,
# AWS_SECRET_ACCESS_KEY, D1_EXPORT_TOKEN. See docs/deploy.md. Values wrapped
# in double underscores are filled from GitHub repository variables by the
# deploy workflow.
name = "pickem"
main = "build/worker/shim.mjs"
compatibility_date = "2026-08-01"
routes = [{ pattern = "__PICKEM_HOSTNAME__", custom_domain = true }]
# Served only at the custom domain. The account still needs a workers.dev
# subdomain to exist, or Cloudflare refuses the cron trigger.
workers_dev = false
preview_urls = false

[build]
command = "worker-build --release"

# The Worker runs first only for the API and the login redirect; every other
# path is served from the built frontend, with unknown paths falling back to
# index.html for client-side routes.
[assets]
directory = "../../frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/login"]

[[d1_databases]]
binding = "DB"
database_name = "pickem"
database_id = "f661afdb-50cc-401a-b937-5dc3e57d729c"
migrations_dir = "../../migrations"

# 09:00 UTC is 4-5am US Eastern/Central, outside game windows.
[triggers]
crons = ["0 9 * * *"]

# Keeps invocation logs in the dashboard; the nightly backup runs unwatched.
[observability]
enabled = true

[vars]
ACCESS_TEAM_DOMAIN = "__ACCESS_TEAM_DOMAIN__"
ACCESS_AUD = "970e471f6d9cb33552018fa90a410494054a495e875d05f1c21bf95e944d6558"
CF_ACCOUNT_ID = "60b129195731562f33864fb68ba1565e"
D1_DATABASE_ID = "f661afdb-50cc-401a-b937-5dc3e57d729c"
S3_BUCKET = "__S3_BUCKET__"
S3_REGION = "us-east-2"
S3_PREFIX = "pickem"

# Staging: a separate Worker and database, deployed from the `staging` branch.
# Wrangler does not inherit routes, vars, d1_databases or triggers into a named
# environment, so each is set here; assets, build and observability are
# inherited. There is no cron, so the backup's S3, account and database-id vars
# are omitted. EMAIL_HASH_KEY is set by hand on this Worker.
[env.staging]
name = "pickem-staging"
routes = [{ pattern = "__STAGING_HOSTNAME__", custom_domain = true }]
workers_dev = false
preview_urls = false

[[env.staging.d1_databases]]
binding = "DB"
database_name = "pickem-staging"
database_id = "bbb7a55e-5891-4052-8c87-1eb56f6f77c0"
migrations_dir = "../../migrations"

[env.staging.triggers]
crons = []

[env.staging.vars]
ACCESS_TEAM_DOMAIN = "__ACCESS_TEAM_DOMAIN__"
ACCESS_AUD = "__STAGING_ACCESS_AUD__"
