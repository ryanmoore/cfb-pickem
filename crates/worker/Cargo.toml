[package]
name = "pickem-worker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

# Crypto goes through the runtime's SubtleCrypto or `pickem-core`'s RustCrypto;
# `ring`, `rustls`, `rsa`, `jsonwebtoken` and `aws-sdk-*` must never appear
# here, because they either do not build for wasm32-unknown-unknown or blow
# the free plan's script size limit.
[dependencies]
pickem-core = { path = "../core" }
worker = { version = "0.8", features = ["d1"] }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[dependencies.web-sys]
version = "0.3"
features = ["Crypto", "SubtleCrypto", "CryptoKey"]
