name: Deploy

on:
  push:
    branches: [main, rust-rewrite]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2.7.5

      # The archive reconciliation test skips itself without PICKEM_LEGACY_DB.
      - run: cargo test --locked

      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci && npm run build
        working-directory: frontend

      - run: cargo install worker-build --version 0.8.7 --locked

      - run: npx --yes wrangler@4.152.0 d1 migrations apply pickem --remote
        working-directory: crates/worker

      - run: npx --yes wrangler@4.152.0 deploy
        working-directory: crates/worker
